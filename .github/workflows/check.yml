name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vim-minimum:
    name: Vim 8.2 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: rhysd/action-setup-vim@b7934f0630263431f328b14fdd86c788f3fadbc8
        id: vim
        with:
          version: v8.2.0000

      - name: Check the minimum supported Vim
        env:
          CHOPSTICKS_TEST_VIM: ${{ steps.vim.outputs.executable }}
        run: |
          "$CHOPSTICKS_TEST_VIM" --version | head -1
          sh scripts/lint-vim.sh

  windows:
    name: Windows Vim smoke
    runs-on: windows-2025
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: rhysd/action-setup-vim@b7934f0630263431f328b14fdd86c788f3fadbc8
        id: vim
        with:
          version: v9.2.0984

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Check benchmark harness
        run: |
          npm ci --ignore-scripts
          npm run test:launcher
          npm run test:benchmark

      - name: Check Windows startup and data paths
        shell: bash
        env:
          CHOPSTICKS_TEST_SKIP_VIMLINT: 1
          CHOPSTICKS_TEST_UI_CASES: >-
            default data-dir-override data-dir-invalid-type data-dir-empty
            path-overrides fzf-unavailable session
          CHOPSTICKS_TEST_VIM: ${{ steps.vim.outputs.executable }}
        run: |
          set -o pipefail
          "$CHOPSTICKS_TEST_VIM" --version | head -1
          "$CHOPSTICKS_TEST_VIM" -Nu NONE -i NONE -n -N -es \
            -c 'call assert_true(has("patch-9.1.1947"))' \
            -c 'if !empty(v:errors) | cquit | endif' \
            -c 'qall!'
          sh scripts/lint-vim.sh

  vim:
    name: Vim and Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache: false

      - name: Install Vim and check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl fzf ripgrep shellcheck vim
          npm ci --ignore-scripts
          vim --version | head -1

      - name: Install pinned Vim plugins
        env:
          CHOPSTICKS_TEST_HOME: ${{ runner.temp }}/chopsticks-home
        run: |
          mkdir -p "$CHOPSTICKS_TEST_HOME/.vim/autoload"
          curl -fsSL \
            https://raw.githubusercontent.com/junegunn/vim-plug/88e31471818e9a29a8a20a0ee61360cfd7bdc1cd/plug.vim \
            -o "$CHOPSTICKS_TEST_HOME/.vim/autoload/plug.vim"
          echo "7e2b20cd909da9c456498684c98f03c63829170f01e34595dd8e1818a217d37c  $CHOPSTICKS_TEST_HOME/.vim/autoload/plug.vim" \
            | sha256sum --check
          HOME="$CHOPSTICKS_TEST_HOME" \
            vim -Nu "$GITHUB_WORKSPACE/.vimrc" -n --not-a-term \
              '+PlugInstall --sync' '+qall!'

      - name: Check startup performance budget
        env:
          CHOPSTICKS_TEST_HOME: ${{ runner.temp }}/chopsticks-home
        run: |
          npm run test:benchmark
          python3 -B scripts/benchmark-vim.py \
            --samples 21 \
            --home "$CHOPSTICKS_TEST_HOME" \
            --check \
            --json "$RUNNER_TEMP/chopsticks-performance.json"

      - name: Upload startup performance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chopsticks-performance
          path: ${{ runner.temp }}/chopsticks-performance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check Vim startup and Markdown setup
        env:
          CHOPSTICKS_TEST_HOME: ${{ runner.temp }}/chopsticks-home
        run: |
          run_plugin_test() {
            test_case=$1
            shift
            test_errors="${{ runner.temp }}/plugin-$test_case.errors"
            test_log="${{ runner.temp }}/plugin-$test_case.log"
            if ! env \
              HOME="$CHOPSTICKS_TEST_HOME" \
              CHOPSTICKS_TEST_CASE="$test_case" \
              CHOPSTICKS_TEST_ERRORS="$test_errors" \
              vim -Nu "$GITHUB_WORKSPACE/.vimrc" -i NONE -n -es \
                -V1"$test_log" "$@" -S "$GITHUB_WORKSPACE/tests/plugins.vim"
            then
              echo "plugin integration test failed: $test_case" >&2
              if [ -s "$test_errors" ]; then
                sed 's/^/  /' "$test_errors" >&2
              else
                sed 's/^/  /' "$test_log" >&2
              fi
              return 1
            fi
          }

          run_plugin_test startup \
            --cmd 'let g:chopsticks_icons = 1' README.md
          run_plugin_test auto-lint \
            --cmd 'let g:chopsticks_icons = 1' \
            --cmd 'let g:chopsticks_auto_lint = 1' README.md
          run_plugin_test fern-toggle \
            --cmd 'let g:chopsticks_icons = 1' README.md
          run_plugin_test fern-directory \
            --cmd 'let g:chopsticks_icons = 1' "$GITHUB_WORKSPACE"
          run_plugin_test netrw-toggle \
            --cmd 'let g:chopsticks_icons = 0' \
            --cmd 'let g:chopsticks_use_fern = 0' README.md
          run_plugin_test netrw-directory \
            --cmd 'let g:chopsticks_icons = 0' \
            --cmd 'let g:chopsticks_use_fern = 0' "$GITHUB_WORKSPACE"

      - name: Lint source and configuration
        run: |
          npm run lint
          git diff --check
