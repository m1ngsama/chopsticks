name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vim:
    name: Vim and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v5

      - name: Install Vim and check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl fzf ripgrep vim
          npm install --global markdownlint-cli
          vim --version | head -1

      - name: Install pinned Vim plugins
        env:
          CHOPSTICKS_TEST_HOME: ${{ runner.temp }}/chopsticks-home
        run: |
          mkdir -p "$CHOPSTICKS_TEST_HOME/.vim/autoload"
          curl -fsSL \
            https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim \
            -o "$CHOPSTICKS_TEST_HOME/.vim/autoload/plug.vim"
          HOME="$CHOPSTICKS_TEST_HOME" \
            vim -Nu "$GITHUB_WORKSPACE/.vimrc" -n --not-a-term \
              '+PlugInstall --sync' '+qall!'

      - name: Check Vim startup and Markdown setup
        env:
          CHOPSTICKS_TEST_HOME: ${{ runner.temp }}/chopsticks-home
        run: |
          HOME="$CHOPSTICKS_TEST_HOME" \
            vim -Nu "$GITHUB_WORKSPACE/.vimrc" -n -es \
              -c 'edit README.md' \
              -c 'doautocmd VimEnter' \
              -c 'call assert_equal("0.1.0", get(g:, "chopsticks_version", "")) | call assert_equal(2, exists(":ChopsticksHealth")) | call assert_equal(2, exists(":ChopsticksCheatsheet")) | call assert_equal(2, exists(":MarkdownPasteImage")) | call assert_true(index(ChopsticksHealthLines(), "[ok] all declared plugins installed") >= 0) | call assert_equal("markdown", &filetype) | call assert_true(&l:wrap) | call assert_match("WhichKey", maparg("\<Space>", "n")) | call assert_match("WhichKey", maparg(",", "n")) | call assert_match("ExploreRoot", maparg("\<Space>e", "n")) | call assert_match("FindFiles", maparg(";f", "n")) | call assert_match("TableModeToggle", maparg(",tt", "n")) | call assert_true(len(ChopsticksKeyLines()) >= 100) | call assert_true(has_key(ChopsticksInputMethodInfo(), "preserve_external")) | call assert_match("InputMethodDeactivate", execute("autocmd ChopsticksInputMethod FocusLost")) | call assert_match("InputMethodActivate", execute("autocmd ChopsticksInputMethod FocusGained")) | if !empty(v:errors) | cquit | endif | qall!'
          HOME="$CHOPSTICKS_TEST_HOME" \
            vim -Nu "$GITHUB_WORKSPACE/.vimrc" -n -es README.md \
              -c 'set columns=100 lines=40' \
              -c 'ChopsticksDashboard' \
              -c 'let dashboard = getline(1, "$") | let dashboard_text = join(dashboard, "\n") | let normal_bg = synIDattr(hlID("Normal"), "bg", "gui") | let first_item = line(".") | call assert_equal("chopsticks-dashboard", &filetype) | call assert_equal(0, &showtabline) | call assert_equal(0, &laststatus) | call assert_true(dashboard_text =~# "CHOPSTICKS" || dashboard_text =~# "███") | call assert_equal(7, match(dashboard, "███") + 1) | call assert_equal(19, virtcol([7, match(dashboard[6], "█") + 1])) | call assert_equal(16, first_item) | call assert_equal(21, virtcol([first_item, match(getline(first_item), "") + 1])) | call assert_equal(80, virtcol([first_item, match(getline(first_item), "f$") + 1])) | call assert_equal(34, match(dashboard, "Vim loaded") + 1) | call assert_equal(1, len(filter(copy(dashboard), {_, text -> text =~# "Find File.*f$"}))) | call assert_equal(1, len(filter(copy(dashboard), {_, text -> text =~# "Restore Session.*s$"}))) | call assert_match("Vim loaded", dashboard_text) | call assert_notmatch("bold", execute("highlight ChopDashboardLogo")) | call assert_match("bold", execute("highlight ChopDashboardIcon")) | call assert_equal("#268bd3", synIDattr(hlID("ChopDashboardLogo"), "fg", "gui")) | call assert_equal("#29a298", synIDattr(hlID("ChopDashboardItem"), "fg", "gui")) | call cursor(first_item - 1, 1) | doautocmd CursorMoved | call assert_equal(first_item, line(".")) | call assert_true(col(".") > 1) | call assert_true(index(["", "NONE"], normal_bg) >= 0) | call assert_equal("", &t_RV) | call assert_equal("", &t_u7) | call assert_equal("", &t_RF) | call assert_equal("", &t_RB) | edit README.md | call assert_equal(2, &showtabline) | call assert_equal(2, &laststatus) | if !empty(v:errors) | cquit | endif | qall!'
          HOME="$CHOPSTICKS_TEST_HOME" \
            vim -Nu "$GITHUB_WORKSPACE/.vimrc" -n -es README.md \
              -c 'call feedkeys("\<Space>e", "xt")' \
              -c 'call assert_equal("netrw", &filetype) | call assert_equal(2, winnr("$"))' \
              -c 'call feedkeys("\<Space>e", "xt")' \
              -c 'call assert_equal("markdown", &filetype) | call assert_equal(1, winnr("$"))' \
              -c 'call feedkeys("\<Space>e", "xt") | wincmd p | let content_window = win_getid()' \
              -c 'call feedkeys("\<Space>e", "xt")' \
              -c 'call assert_equal("markdown", &filetype) | call assert_equal(1, winnr("$")) | call assert_equal(content_window, win_getid()) | if !empty(v:errors) | cquit | endif | qall!'

      - name: Check documentation and whitespace
        run: |
          markdownlint README.md
          git diff --check
