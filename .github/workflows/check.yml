name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vim:
    name: Vim and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHOPSTICKS_TEST_HOME: ${{ runner.temp }}/chopsticks-home

    steps:
      - uses: actions/checkout@v5

      - name: Install Vim and check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl fzf ripgrep vim
          npm install --global markdownlint-cli
          vim --version | head -1

      - name: Install pinned Vim plugins
        run: |
          mkdir -p "$CHOPSTICKS_TEST_HOME/.vim/autoload"
          curl -fsSL \
            https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim \
            -o "$CHOPSTICKS_TEST_HOME/.vim/autoload/plug.vim"
          HOME="$CHOPSTICKS_TEST_HOME" \
            vim -Nu "$GITHUB_WORKSPACE/.vimrc" -n --not-a-term \
              '+PlugInstall --sync' '+qall!'

      - name: Check Vim startup and Markdown setup
        run: |
          HOME="$CHOPSTICKS_TEST_HOME" \
            vim -Nu "$GITHUB_WORKSPACE/.vimrc" -n -es \
              -c 'edit README.md' \
              -c 'doautocmd VimEnter' \
              -c 'call assert_equal("0.1.0", get(g:, "chopsticks_version", "")) | call assert_equal(2, exists(":ChopsticksHealth")) | call assert_equal(2, exists(":ChopsticksCheatsheet")) | call assert_equal(2, exists(":MarkdownPasteImage")) | call assert_true(index(ChopsticksHealthLines(), "[ok] all declared plugins installed") >= 0) | call assert_equal("markdown", &filetype) | call assert_true(&l:wrap) | call assert_match("WhichKey", maparg("\<Space>", "n")) | call assert_match("WhichKey", maparg(",", "n")) | call assert_match("FindFiles", maparg(";f", "n")) | call assert_match("TableModeToggle", maparg(",tt", "n")) | call assert_true(len(ChopsticksKeyLines()) >= 100) | if !empty(v:errors) | cquit | endif | qall!'

      - name: Check documentation and whitespace
        run: |
          markdownlint README.md CHANGELOG.md
          git diff --check
